name: Version Consistency

# Catches the failure mode behind two incidents (v1.15.0, v1.15.4): a local
# release-it run where `npm publish` succeeds but a later step (git commit,
# tag, or push) fails, leaving npm ahead of git with nothing to retry except
# starting over. Runs on every push to main (catches it on the next merge)
# and hourly (catches it even with no merges in between).

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare npm, package.json, and the latest git tag
        run: |
          NPM_VERSION=$(npm view @workscribe/cli version)
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          LATEST_TAG=$(git tag --sort=-v:refname | head -1 | sed 's/^v//')

          echo "npm registry (latest): $NPM_VERSION"
          echo "package.json on main:  $PACKAGE_VERSION"
          echo "latest git tag:        v$LATEST_TAG"

          if [ "$NPM_VERSION" != "$PACKAGE_VERSION" ] || [ "$NPM_VERSION" != "$LATEST_TAG" ]; then
            echo "::error::Version drift detected — npm ($NPM_VERSION), package.json ($PACKAGE_VERSION), and the latest git tag (v$LATEST_TAG) don't all agree. See PR #43/#51 for the reconciliation playbook."
            exit 1
          fi

          echo "✓ npm, package.json, and git tags all agree on $NPM_VERSION"
