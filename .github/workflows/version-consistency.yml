name: Version Consistency

# Catches npm/git drift (v1.15.0, v1.15.4 incidents): a release-it run where
# npm publish succeeds but a later git step fails. Retries before failing —
# npm publish and the git push aren't atomic, so a few seconds of mismatch
# right after a real release is normal, not drift.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare npm, package.json, and the latest git tag
        run: |
          MAX_ATTEMPTS=5
          DELAY_SECONDS=15
          PACKAGE_VERSION=$(node -p "require('./package.json').version")

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            git fetch origin --tags --quiet
            NPM_VERSION=$(npm view @workscribe/cli version)
            LATEST_TAG=$(git tag --sort=-v:refname | head -1 | sed 's/^v//')

            if [ "$NPM_VERSION" = "$PACKAGE_VERSION" ] && [ "$NPM_VERSION" = "$LATEST_TAG" ]; then
              echo "✓ npm, package.json, and git tags all agree on $NPM_VERSION"
              exit 0
            fi

            echo "Attempt $attempt/$MAX_ATTEMPTS: npm=$NPM_VERSION package.json=$PACKAGE_VERSION tag=v$LATEST_TAG — retrying in ${DELAY_SECONDS}s"
            sleep "$DELAY_SECONDS"
          done

          echo "::error::Version drift detected after $MAX_ATTEMPTS retries — npm ($NPM_VERSION), package.json ($PACKAGE_VERSION), and the latest git tag (v$LATEST_TAG) don't all agree. See PR #43/#51 for the reconciliation playbook."
          exit 1
