name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to docs repo
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Clone the public docs repo
          git clone https://x-access-token:${{ secrets.DOCS_DEPLOY_TOKEN }}@github.com/workscribe/docs.git /tmp/docs-repo

          # Sync docs/site/ into the docs repo root (preserve .git)
          rsync -av --delete --exclude='.git' docs/site/ /tmp/docs-repo/

          # Commit and push if anything changed
          cd /tmp/docs-repo
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "docs: sync from cli@${{ github.sha }}"
            git push origin HEAD:main
          fi
